version: "3.8"
services:
  app:
    container_name: application
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    ports:
     - "3000:3000"
    volumes:
      - .:/workspace/app
    depends_on:
      - db
  db:
    image: mysql:8.0 
    container_name: dataBase
    ports:
      - "3001:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
